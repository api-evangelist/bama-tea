description: 'BAMA TEA (八马茶业), a brand of Fujian Bama Tea Industry Co., Ltd., is a large-scale Chinese
  tea enterprise founded in 1997 and headquartered in Anxi County, Quanzhou, Fujian Province. It integrates
  tea plantation cultivation, production and processing, branded retail-chain distribution, and export,
  and is best known for Tieguanyin oolong. The company operates a nationwide network of branded retail
  stores across China and sells oolong, black, green, white, and dark teas. It is a publicly listed company
  and a portfolio investment of IDG Capital. Added to the API Evangelist network as a consumer-sector lead:
  BAMA TEA publishes a consumer e-commerce website but no public developer API, SDK, or documentation surface,
  so the API-artifact enrichment recipes do not apply.'
